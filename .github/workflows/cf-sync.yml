name: Codeforces Auto Sync

on:
  schedule:
    - cron: '0 0 * * *' # every night at 12
  workflow_dispatch: # manual run

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Updated to v4 to fix deprecation warning

      - name: Set up Python
        uses: actions/setup-python@v5 # Updated to v5 to fix deprecation warning
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Sync Script
        run: python sync.py

      - name: Commit and Push
        run: |
          git config --global user.name "sajibmrbitz"
          git config --global user.email "sajibmr2005@gmail.com"
          git add .
          
          # Check if there are any changes before committing
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-synced new Codeforces submissions" && git push)
